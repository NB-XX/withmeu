name = "withmeu"
main = "worker.js"
compatibility_date = "2025-06-11"

[[d1_databases]]
binding = "DB"
database_name = "withmeu-db"
database_id = "b823eaa2-57a5-46b0-837c-f490c6fcc7e9" # Cloudflare dashboard > withmeu-db

[triggers]
# */3: 抓新消息+就地翻译（不做历史扫描）；17 分: 回填近 7 天翻译失败；3:41: 全历史兜底
crons = ["*/3 * * * *", "17 * * * *", "41 3 * * *"]

[assets]
directory = "./public"

# Site access password. Leave unset (or empty) for open access (no password).
# Recommended: set as a secret so it is not stored in plaintext:
#   wrangler secret put ACCESS_PASSWORD
# For local dev with server.js, set the same env var:
#   ACCESS_PASSWORD=... node server.js
[env.production]
# Add production vars here
